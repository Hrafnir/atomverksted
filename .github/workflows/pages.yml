name: Test og publiser Atomverksted
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node verify-chemistry.cjs
      - run: node verify-layout.cjs
      - run: node verify-compound-reference.cjs
      - run: node verify-facts.cjs
      - run: node verify-learning.cjs
      - run: node verify-hydroxide.cjs
      - run: node verify-kit3d.cjs
      - run: node verify-kit-capture.cjs
      - run: node verify-transfer.cjs
      - run: node verify-capture.cjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
